name: Tasmota firmware builds

on:
  push:
    branches:
      - feature/central-firmware-builds

permissions:
  contents: read

concurrency:
  group: tasmota-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - tasmota32
          - tasmota32-safeboot
          - tasmota32-ottelo-pow-slim
    steps:
      - name: Checkout this branch only
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio==6.2.0

      - name: Report build toolchain versions
        run: |
          pio --version
          python -m pip show platformio || true
          python -m pip show pioarduino || true

      - name: Verify resolved POW Slim build configuration
        if: matrix.environment == 'tasmota32-ottelo-pow-slim'
        run: |
          pio project config --json-output > /tmp/pio-project-config.json
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("/tmp/pio-project-config.json").read_text())
          rendered = json.dumps(config, sort_keys=True)
          required = ("-DUSE_CONFIG_OVERRIDE", "-DOTTELLO_POW_SLIM")
          missing = [flag for flag in required if flag not in rendered]
          if missing:
              raise SystemExit("Resolved PlatformIO configuration is missing: " + ", ".join(missing))
          if "\\\\${env:tasmota32_base.build_flags}" in rendered or "\\${env:tasmota32_base.build_flags}" in rendered:
              raise SystemExit("PlatformIO left the base build_flags interpolation unresolved")
          print("Resolved PlatformIO config contains both required POW Slim build flags.")
          PY

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.environment }}
          path: build_output/firmware/**
          if-no-files-found: error
          retention-days: 14
