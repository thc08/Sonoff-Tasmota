name: Build Ottelo C3 TC (Speicher)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UMGEBUNG: tasmota32c3_ottelo_tc
    steps:
      - name: Fork holen
        uses: actions/checkout@v4

      - name: Ottelos Rezept holen
        uses: actions/checkout@v4
        with:
          repository: ottelo9/tasmota-sml-images
          path: overlay

      - name: Rezept anwenden
        run: |
          echo "--- Inhalt von Ottelos Repo ---"
          ls -la overlay
          cp -f overlay/tasmota/user_config_override.h tasmota/user_config_override.h
          shopt -s nullglob
          for f in overlay/*.ini overlay/*.py; do
            echo "Kopiere $(basename "$f")"
            cp -f "$f" .
          done
          for d in boards partitions pio-tools; do
            if [ -d "overlay/$d" ]; then
              echo "Kopiere Ordner $d"
              mkdir -p "$d"
              cp -rn "overlay/$d/." "$d/"
            fi
          done

      - name: Speicher-C3 Anpassungen
        run: |
          cat >> tasmota/user_config_override.h <<'EOF'

          // ---- Speicher C3: ZC-Dimmer und DS18B20, sonst schlank ----
          // ZCDimmerSet gehoert zum Licht-Treiber
          #undef USE_LIGHT
          #define USE_LIGHT
          // nicht gebraucht
          #undef USE_SML_M
          #undef USE_SML_CRC
          #undef USE_SML_AUTHKEY
          #undef USE_SML_SCRIPT_CMD
          #undef USE_INFLUXDB
          #undef USE_HOME_ASSISTANT
          #undef USE_BMP
          EOF

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: PlatformIO installieren
        run: |
          pip install "platformio==6.2.0" || pip install "platformio>=6.2.1" || pip
