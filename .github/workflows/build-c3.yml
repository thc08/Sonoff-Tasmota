name: Build Ottelo C3 TC (Speicher)

on:
  workflow_dispatch:
    inputs:
      anpassungen:
        description: 'Speicher-C3 Anpassungen einbauen (ZC-Dimmer, DS18B20, ohne SML)?'
        required: true
        default: true
        type: boolean
      mqttevent:
        description: 'SUPPORT_MQTT_EVENT einschalten (MQTT-Empfang)?'
        required: true
        default: true
        type: boolean
      rules:
        description: 'USE_RULES einschalten (nur fuer den Totmannschalter)?'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UMGEBUNG: tasmota32c3_ottelo_tc
    steps:
      - name: Fork holen
        uses: actions/checkout@v4

      - name: Ottelos Rezept holen
        uses: actions/checkout@v4
        with:
          repository: ottelo9/tasmota-sml-images
          path: overlay

      - name: Rezept anwenden
        run: |
          echo "--- Inhalt von Ottelos Repo ---"
          ls -la overlay
          echo "--- Ottelos Stand von Gemus Code ---"
          cat "overlay/gemu2015 Repo Update.txt" || true
          echo "--- Dateien in Ottelos tasmota-Ordner ---"
          find overlay/tasmota -type f | head -60
          echo "--- Ordner in Ottelos lib-Ordner ---"
          ls overlay/lib
          shopt -s nullglob
          for f in overlay/*.ini overlay/*.py; do
            echo "Kopiere $(basename "$f")"
            cp -f "$f" .
          done
          for d in tasmota lib boards partitions pio-tools; do
            if [ -d "overlay/$d" ]; then
              echo "Kopiere Ordner $d"
              mkdir -p "$d"
              cp -rf "overlay/$d/." "$d/"
            fi
          done
          
      - name: TinyC-Treiber pruefen
        run: |
          echo "--- Dateien mit dem MQTT-Teil von TinyC ---"
          for f in $(grep -rl "tc_mqtt_subscribe" tasmota); do
            echo "== $f"
            grep -n "USE_MQTT" "$f" | head -5 || true
          done
          echo "--- Von Ottelos Ordnern geaenderte Dateien (TinyC) ---"
          git status --short | grep -i "tinyc\|xdrv_124" || echo "keine"    

      - name: Speicher-C3 Anpassungen
        if: ${{ inputs.anpassungen }}
        run: |
          cat >> tasmota/user_config_override.h <<'EOF'

          // ---- Speicher C3: ZC-Dimmer und DS18B20, sonst schlank ----
          // ZCDimmerSet gehoert zum Licht-Treiber
          #undef USE_LIGHT
          #define USE_LIGHT
          // DS18B20: Sensoren nach ID benennen, verlorene Sensoren neu suchen
          #undef USE_DS18x20_RECONFIGURE
          #define USE_DS18x20_RECONFIGURE
          #undef DS18x20_USE_ID_AS_NAME
          #define DS18x20_USE_ID_AS_NAME
          // nicht gebraucht
          #undef USE_SML_M
          #undef USE_SML_CRC
          #undef USE_SML_AUTHKEY
          #undef USE_SML_SCRIPT_CMD
          #undef USE_INFLUXDB
          #undef USE_HOME_ASSISTANT
          #undef USE_BMP
          EOF

      - name: MQTT-Ereignisse einschalten
        if: ${{ inputs.mqttevent }}
        run: |
          cat >> tasmota/user_config_override.h <<'EOF'

          // MQTT-Abonnements: Empfang von Nachrichten
          #ifndef SUPPORT_MQTT_EVENT
          #define SUPPORT_MQTT_EVENT
          #endif
          EOF

      - name: Regeln einschalten
        if: ${{ inputs.rules }}
        run: |
          cat >> tasmota/user_config_override.h <<'EOF'

          // Regeln (Ottelo schaltet sie sonst ab), fuer den Totmannschalter
          #undef USE_RULES
          #define USE_RULES
          EOF

      - name: Wire1-Korrektur fuer den C3
        run: |
          F=tasmota/tasmota_xdrv_driver/xdrv_50_filesystem.ino
          if grep -q "Wire1" "$F"; then
            echo "Wire1 gefunden, ersetze durch Wire (C3 hat nur einen I2C-Bus)"
            sed -i 's/\bWire1\b/Wire/g' "$F"
          else
            echo "Kein Wire1 in $F"
          fi

      - name: Kamera-Bibliothek fuer den C3 entfernen
        run: |
          if [ -d lib/lib_div/esp32-camera ]; then
            echo "Entferne lib/lib_div/esp32-camera (C3 ohne Kamera)"
            rm -rf lib/lib_div/esp32-camera
          else
            echo "lib/lib_div/esp32-camera nicht vorhanden"
          fi

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PlatformIO installieren
        run: |
          pip install wheel
          pip install "platformio==6.2.0" || pip install -U platformio
          pio --version

      - name: Kernversion der Plattform festlegen
        run: |
          echo "pioarduino==6.2.0" > "$RUNNER_TEMP/constraints.txt"
          echo "UV_CONSTRAINT=$RUNNER_TEMP/constraints.txt" >> "$GITHUB_ENV"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/constraints.txt" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/constraints.txt"

      - name: Safeboot bauen
        run: |
          pio run -e tasmota32c3-safeboot
          echo "--- gefundene Safeboot-Dateien ---"
          find . -name "*safeboot*.bin" -not -path "./.pio/libdeps/*" | head -50
          mkdir -p build_output/firmware variants/tasmota
          for f in build_output/firmware/tasmota32c3-safeboot.bin variants/tasmota/tasmota32c3-safeboot.bin; do
            if [ -f "$f" ]; then
              cp "$f" build_output/firmware/tasmota32c3_ottelo_tc-safeboot.bin
              cp "$f" variants/tasmota/tasmota32c3_ottelo_tc-safeboot.bin
            fi
          done

      - name: Image bauen
        run: |
          set -o pipefail
          pio run -e "$UMGEBUNG" 2>&1 | tee build.log

      - name: Fehlerzeilen anzeigen
        if: failure()
        run: |
          echo "--- Zeilen mit error: ---"
          grep -n -B3 -A8 "error:" build.log | head -150 || true

      - name: Firmware suchen
        if: always()
        run: |
          echo "--- build_output/firmware ---"
          ls -la build_output/firmware || true
          echo "--- .pio/build ---"
          ls -la ".pio/build/$UMGEBUNG" | head -40 || true
          echo "--- alle ottelo-bin ---"
          find . -name "*ottelo*.bin" -not -path "./overlay/*" | head -30

      - name: Datum merken
        if: always()
        run: echo "DATUM=$(date +%Y-%m-%d_%H%M)" >> "$GITHUB_ENV"

      - name: Ergebnis bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speicher-c3-tc-${{ env.DATUM }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            build_output/firmware/
            .pio/build/tasmota32c3_ottelo_tc/firmware.bin
